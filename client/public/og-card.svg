<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0f1a1a"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint concentric circles suggesting "radius" -->
  <g stroke="#5eead4" fill="none" stroke-width="0.8" opacity="0.12">
    <circle cx="960" cy="180" r="80"/>
    <circle cx="960" cy="180" r="160"/>
    <circle cx="960" cy="180" r="240"/>
    <circle cx="960" cy="180" r="320"/>
  </g>

  <!-- Soft glow behind brand -->
  <circle cx="960" cy="180" r="240" fill="url(#glow)"/>

  <!-- Logo mark, scaled up -->
  <g transform="translate(80 80)" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 36 A28 28 0 0 0 36 8"/>
    <path d="M36 36 L64 36" opacity="0.5"/>
    <circle cx="36" cy="36" r="5" fill="#5eead4" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="135" font-family="'DM Sans', sans-serif" font-size="60" font-weight="500" fill="#fafafa" letter-spacing="-1">Radius</text>

  <!-- Headline -->
  <text x="80" y="380" font-family="'DM Sans', sans-serif" font-size="78" font-weight="500" fill="#fafafa" letter-spacing="-2.5">
    <tspan>Your money, your music,</tspan>
    <tspan x="80" dy="92">your places — in one place.</tspan>
  </text>

  <!-- Sub-headline -->
  <text x="80" y="555" font-family="'JetBrains Mono', monospace" font-size="20" fill="#71717a" letter-spacing="3">
    <tspan>A QUIET PERSONAL DASHBOARD ·  </tspan>
    <tspan fill="#5eead4">RADIUS.APP</tspan>
  </text>
</svg>
