# Force Nixpacks to use Node 20 — several deps (Vite 7, Tailwind oxide,
# Supabase, Plaid 42) require Node >=20. Without this Railway picks Node 18
# and the build fails with EBADENGINE warnings + npm ci errors.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# rm -rf the npm/.cache dir before install to dodge Railway's EBUSY on rmdir
# when the build daemon tries to clean a previously cached layer.
cmds = [
  "rm -rf node_modules/.cache /root/.npm/_cacache || true",
  "npm ci --no-audit --no-fund --prefer-offline"
]

[phases.build]
cmds = [
  "rm -rf node_modules/.cache || true",
  "npm run build"
]

[start]
cmd = "node dist/index.cjs"
