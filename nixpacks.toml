# Force Nixpacks to use Node 20 — several deps (Vite 7, Tailwind oxide,
# Supabase, Plaid 42) require Node >=20. Without this Railway picks Node 18
# and the build fails with EBADENGINE warnings + npm ci errors.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Use `npm install --include=dev` instead of `npm ci`.
# `npm ci` tries to wipe node_modules first, which fails with EBUSY
# on Railway because /app/node_modules/.cache is a mounted volume
# the kernel won't let us rmdir. `npm install` reconciles in place
# without wiping, and --include=dev forces devDependencies even when
# NODE_ENV=production (Railway sets this during build).
cmds = ["npm install --no-audit --no-fund --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/index.cjs"
